name: CI

on:
  push:
    branches: ["main", "portfolio/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    env:
      TMDB_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Unit and security tests
        run: python -m unittest discover -v
      - name: Installed command smoke test
        run: media-cleanup --help
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Create synthetic media
        run: python examples/create_demo.py demo-library
      - name: Save preview
        run: media-cleanup demo-library --plan-out media-cleanup-plan-ci.json
      - name: Apply reviewed plan
        run: media-cleanup demo-library --apply-plan media-cleanup-plan-ci.json --journal media-cleanup-journal-ci.jsonl
      - name: Roll back changes
        run: media-cleanup demo-library --rollback media-cleanup-journal-ci.jsonl
